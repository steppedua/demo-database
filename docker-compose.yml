services:
  postgres:
    image: postgres:16
    container_name: demo-database-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo_database
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo_database"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
