global:
  # Для демо — часто, чтобы графики реагировали за пару секунд. В проде 15–30s.
  scrape_interval: 2s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: demo-database
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
